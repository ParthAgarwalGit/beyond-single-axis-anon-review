name: T18 G2 preflight

on:
  pull_request:
    paths:
      - configs/t18_frozen.yaml
      - docs/G2_GEOMETRY_FREEZE.json
      - docs/deviations/2026-08-25-t18-g2-membership-compatibility.md
      - docs/deviations/2026-08-28-t18-pca-cache-compute-equivalence.md
      - docs/deviations/2026-08-29-t18-outer-fold-parallel-execution.md
      - docs/T18_G2_PRODUCTION_RUN.md
      - docs/deviations/2026-08-30-t18-length-nuisance-diagnostic.md
      - results/t18/**
      - src/t18_readouts.py
      - src/t18_cached.py
      - src/t18_parallel.py
      - tools/run_t18_dimensional_adequacy.py
      - tools/run_t18_g2_dimensional_adequacy.py
      - tools/run_t18_length_nuisance.py
      - tests/test_t18_readouts.py
      - tests/test_t18_cached_equivalence.py
      - tests/test_t18_parallel_equivalence.py
      - tests/test_t18_result_binding.py
      - tests/test_t18_length_nuisance.py
      - tests/test_t18_loader.py
      - tests/test_t18_frozen.py
      - tests/test_t18_g2_compat.py
      - .github/workflows/t18-g2-preflight.yml
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install T18 analysis/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy>=1.11,<1.15' \
            'scikit-learn>=1.4,<1.7' \
            'PyYAML==6.0.3' \
            'pydantic==2.13.4' \
            'jsonschema==4.26.0' \
            'huggingface_hub>=0.34,<1.0' \
            'pytest>=8,<9'
      - name: Run focused T18 tests, compute-equivalence suites, and artifact binding
        run: |
          python -m pytest \
            tests/test_t18_readouts.py \
            tests/test_t18_cached_equivalence.py \
            tests/test_t18_parallel_equivalence.py \
            tests/test_t18_result_binding.py \
            tests/test_t18_length_nuisance.py \
            tests/test_t18_loader.py \
            tests/test_t18_frozen.py \
            tests/test_t18_g2_compat.py -q
      - name: Run frozen known-answer self-test through G2 wrapper
        run: |
          python tools/run_t18_g2_dimensional_adequacy.py \
            --self-test \
            --out /tmp/t18_self_test.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/t18_self_test.json'))
          assert report['validation']['all_passed'] is True
          print(json.dumps(report['validation'], indent=2))
          PY
