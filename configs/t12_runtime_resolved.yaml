  confirmatory_split_algorithm:
    outcome_blind: true
    steps:
    - Remove the frozen E80 IDs from the full 0..239 source-ID space.
    - Place IDs 7 and 227 together in C80-A.
    - Sort remaining IDs by descending source-text character length; break ties by
      ascending ID.
    - Assign each ID to the block with the lower current character total; break ties
      toward C80-A; enforce 80 IDs per block.
    uses_question_categories: false
    uses_model_outputs_or_geometry: false
  all_blocks_assignment_sha256: 6f0213dd56073d3ce87b835e8c7b8a7759ab9b53e78486bced689e3f0c1e6172
