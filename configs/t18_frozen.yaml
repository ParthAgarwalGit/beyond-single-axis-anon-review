schema_version: t18-freeze-v1.0
task: T18
title: Dimensional adequacy and nonlinearity stress test — frozen analysis parameters
freeze_status: FROZEN
freeze_date: '2026-08-13'
frozen_before_any_real_activations_examined: true
owner_executor: [Reviewer]
reviewer: [Author B]
registry_entry: analysis_registry.sensitivity[13]

relation_to_method_freeze:
  method_config: configs/method_frozen.yaml
  held_separately_because: >
    Adding these parameters to method_frozen.yaml would change its
    config_sha256, which is already stamped into every report issued under the
    G2 freeze and would invalidate those references. This file carries its own
    hash, is stamped alongside the method hash in every T18 report, and can be
    promoted into method_frozen.yaml at the next dated method revision if the
    reviewer prefers.
  decision_record: docs/deviations/2026-08-13-t18-analysis-parameters.md

target:
  positive_class: default-Assistant response
  negative_class: retained role-adopted response
  role_eligibility_source: >
    Consumed from the frozen T14/T15 eligible-role artifact. T18 never
    recomputes eligibility from raw score-3 counts, so it cannot diagnose a
    different role set from the one T15/G2 describe.
  judge_region: final_answer
  judge_region_frozen_name: FINAL_ANSWER_TOKENS
  primary_retained_score: 3
  default_conditions_required: 5

splitting:
  scheme: doubly grouped; whole roles and whole questions held out simultaneously
  outer_role_folds: 5
  outer_question_folds: 4
  inner_role_folds: 4
  inner_question_folds: 3
  seed: 20260812

estimand:
  metric: auroc
  aggregation: unweighted mean of within-fold AUROC across outer folds
  pooling_predictions_across_folds_forbidden: true
  row_weighting: role-balanced within class
  aggregation_rationale: >
    Outer folds are fitted independently, so their probability scales are not
    necessarily rank-comparable and an AUROC over pooled scores is not a
    well-defined estimand. Every reported figure, including every bootstrap
    replicate, uses the fold-aggregated statistic.
  weighting_rationale: >
    The Assistant Axis equal-weights retained roles. Row-level optimisation and
    evaluation would instead give high-retention roles more influence, so the
    read-outs would be judged on a different estimand from the geometry they
    are meant to assess. Weights equalise total role contribution within each
    class, and equalise the two classes.

candidates:
  axis: fold-built unit Assistant Axis, projection scored
  pca_k_grid: [1, 2, 3, 5, 8, 12, 20, 32]
  linear_c_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
  nonlinear_hidden_grid: [4, 8, 16]
  nonlinear_alpha_grid: [0.1, 1.0, 10.0]
  nonlinear_solver: lbfgs
  nonlinear_parameter_budget: >
    Trainable parameters must be strictly fewer than the number of training
    roles in the fold. This bounds capacity relative to the grouping unit; it
    is a capacity control, not a proof that role-specific information cannot
    be represented.
  feature_standardisation: >
    Training-fold standard deviations, applied before the penalty, so a single
    C grid means the same thing at every k.
  families_that_may_determine_the_verdict:
  - pca_linear
  - full_linear
  - small_nonlinear
  every_verdict_family_must_be_covered_by_the_known_answer_self_test: true

inference:
  cluster: role
  bootstrap_replicates: 2000
  confidence_level: 0.95
  comparison: paired against the Axis on shared resamples
  multiplicity: >
    Simultaneous max-over-families bootstrap. Each replicate takes the maximum
    of (family AUROC minus Axis AUROC) across all verdict families, so the
    interval already accounts for selecting the best-performing alternative
    and no single family can trigger a verdict on its own.
  adequacy_margin_auroc: 0.02
  margin_rationale: >
    Paired intervals are tight enough that a bare significance test would flag
    differences of about 0.01 AUROC as findings. The verdict is therefore an
    equivalence decision against a fixed margin, set before any real
    activations were examined.
  verdict_rules:
    INADEQUATE: simultaneous lower bound of the max-family difference exceeds the margin
    ADEQUATE: simultaneous upper bound of the max-family difference is below the margin
    INCONCLUSIVE: the simultaneous interval straddles the margin
  question_clustered_intervals: >
    Diagnostic only. Measured coverage of chance under a null was 1 of 8
    against 8 of 8 for role clustering, so they may never support a verdict.

diagnostics:
  group_label_permutation:
    replicates: 20
    status: >
      Descriptive only. Twenty replicates locate the null roughly; they are not
      an inferential test and no p-value is derived from them.

gate:
  requires_g2_geometry_freeze: true
  freeze_record: docs/G2_GEOMETRY_FREEZE.json
  rationale: >
    T18 asks whether the frozen geometry is an adequate summary. Running it
    against a geometry that can still move would let the answer influence the
    thing it describes, and would compete with T06/T07 for the same artifacts.
