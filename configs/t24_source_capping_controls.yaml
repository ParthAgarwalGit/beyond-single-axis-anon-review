  primary_matching_target: measured per-layer source Axis-cap engagement on the same natural_L rows
  original_q25_q75_role: unmatched-engagement sensitivity/reference only

orthogonal_random_cap:
  base_seed: 20260818
  per_layer_seed: sha256('t24|<base_seed>|layer=<L>') first 8 bytes little-endian
  construction: sample g~N(0,I); remove projection onto unit released Assistant Axis; unit-normalize
  orthogonality_tolerance_absolute_cosine: 1.0e-6
  threshold_rule_primary: quantile equal to measured source Axis-cap engagement on that layer's common frozen natural calibration rows
  intervention_rule: clamp projections below the frozen threshold up to the threshold
  engagement_match_reference: measured source Axis-cap engagement on the same natural_L rows
  engagement_match_absolute_tolerance: 0.03
  raw_axis_threshold_reuse_forbidden: true
  original_predeclared_sensitivity_quantile: 0.25

spherical_distance_cap:
  classification: PROJECT_DEFINED_CONTROL_NOT_LU_METHOD
  center_rule: frozen default-Assistant centroid at each capped layer
  radius_rule_primary: distance quantile equal to one minus the measured source Axis-cap engagement on that layer, so the outer-tail engagement matches the source rate
  intervention_rule: if distance <= radius, no-op; otherwise radial projection to sphere boundary
  engagement_match_reference: measured source Axis-cap engagement on the same natural_L rows
  engagement_match_absolute_tolerance: 0.03
  radius_outcome_tuning_forbidden: true
  original_predeclared_sensitivity_radius_quantile: 0.75

