matching_constraints:
  - same model and revision
  - same evaluation rows
  - same capped layers
  - same token positions
  - same dtype
  - same decoding
  - same batch/shard ordering where execution permits
  - same scoring
  - same natural calibration corpus and serialization

required_preproduction_validation:
  - released Assistant-Axis file SHA-256 matches the T21 pin
  - released capping-config file SHA-256 matches the T21 pin
  - calibration axis_L matches the released Assistant Axis at every capped layer
  - source capping-config vector is collinear with and negatively oriented to the released Assistant Axis at every capped layer
  - source Axis-cap engagement is measured on natural_L using the released per-layer thresholds
  - per-layer random unit norm
  - per-layer Axis/random numerical orthogonality
  - primary random engagement matches measured source Axis-cap engagement within tolerance
  - primary sphere engagement matches measured source Axis-cap engagement within tolerance
  - original q25/q75 parameters are retained as unmatched-engagement sensitivity/reference
  - directional no-op correctness
  - sphere no-op correctness
  - sphere radial-boundary correctness
  - production JSON and external NPZ hashes agree with the recovery receipt

claim_boundary:
  source_axis_cap: Source-matched T21 condition; fixed before T24 controls and unchanged by the deviation.
  random_cap: Project control calibrated to the measured source engagement rate per layer; not a Lu source method.
  sphere_cap: Project control calibrated to the measured source engagement rate per layer via the complementary radius quantile; not a Lu source method.
  matching_limit: Engagement incidence is matched; intervention magnitude and geometry are not claimed to be matched.
  engagement_gate_interpretation: The 0.03 engagement gate is a self-consistency and regression guard after the primary quantiles are derived from measured source engagement; it is not independent evidence of control comparability.
  matched_control_strength_asymmetry: At layers 46-49 the source engagement exceeds 0.5, so matched controls engage a majority of natural rows; the spherical control specifically projects that majority toward the default-Assistant centroid. T29 must interpret positive sphere effects as potentially reflecting both intervention strength and geometry.
  inference: T24 freezes controls only; causal-specificity conclusions require T29 outcomes.


